name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Auto Release
    # Forks only: Netflix/jfmt releases from version tags via release.yml.
    if: ${{ github.repository != 'Netflix/jfmt' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Configure release
        run: echo "BUILD_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Set up ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.22.1

      - name: Test
        run: ja test --all

      - name: Assemble
        run: ja assemble --jmod --module-version "$BUILD_VERSION" build/artifacts

      - name: Create GitHub release
        run: |
          shopt -s nullglob
          gh release create "v$BUILD_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$BUILD_VERSION" \
              --generate-notes \
              build/artifacts/*.jar build/artifacts/*.jmod
        env:
          GH_TOKEN: ${{ github.token }}
