name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'Netflix/jfmt' }}
    environment: Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Configure release
        run: echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.22.1

      - name: Test
        run: ja test --all

      - name: Assemble
        run: ja assemble --jmod --module-version "$BUILD_VERSION" build/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jfmt
          path: build/artifacts
          if-no-files-found: error

      - name: Publish to Maven Central
        run: ja maven deploy-central --module-version "$BUILD_VERSION"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.ORG_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.ORG_SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.ORG_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.ORG_SIGNING_PASSWORD }}

  github-release:
    name: GitHub Release
    if: ${{ github.repository == 'Netflix/jfmt' }}
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: jfmt
          path: artifacts

      - name: Create GitHub release
        run: |
          shopt -s nullglob
          arguments=(
            "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}" artifacts/*.jar artifacts/*.jmod
        env:
          GH_TOKEN: ${{ github.token }}
